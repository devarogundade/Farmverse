[workspace]
resolver = "3"
members = ["contracts/farm_token", "contracts/items", "contracts/market", "tests"]
# The sandbox integration tests download a Linux/macOS neard binary; build contracts only by default.
default-members = ["contracts/farm_token", "contracts/items", "contracts/market"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/devarogundade/Farmverse"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
