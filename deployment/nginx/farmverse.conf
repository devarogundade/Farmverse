# Public entry for the Farmverse API (api. and server.farmverse.world → 127.0.0.1:8787).
# certbot --nginx adds the 443 listener, the certificate lines and the HTTP → HTTPS redirect
# to this block; provision.sh reinstalls them after copying this file over.

# WebSocket (/v1/live): pass the upgrade through, plain keep-alive otherwise.
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

upstream farmverse_api {
	server 127.0.0.1:8787;
	keepalive 32;
}

server {
	listen 80;
	listen [::]:80;
	server_name api.farmverse.world server.farmverse.world;

	# The server accepts bodies up to 4 MB.
	client_max_body_size 5m;

	location / {
		proxy_pass http://farmverse_api;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# Live sockets may sit quiet for a long time.
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}
}

# ---- the static sites (plan 15 §9 D18): deploy.sh --web uploads them to /var/www/farmverse/<site> ----

# play.farmverse.world: the Unity WebGL build. Its files are Brotli-compressed (.br): served as they are, with
# Content-Encoding: br and the right type, so the browser unpacks them (the build has no decompression fallback).
server {
	listen 80;
	listen [::]:80;
	server_name play.farmverse.world;
	root /var/www/farmverse/play;
	index index.html;

	location ~ \.wasm\.br$ { add_header Content-Encoding br; default_type application/wasm; gzip off; add_header Cache-Control "public, max-age=3600"; }
	location ~ \.js\.br$ { add_header Content-Encoding br; default_type application/javascript; gzip off; add_header Cache-Control "public, max-age=3600"; }
	location ~ \.(data|symbols\.json)\.br$ { add_header Content-Encoding br; default_type application/octet-stream; gzip off; add_header Cache-Control "public, max-age=3600"; }
	location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}

# marketplace.farmverse.world (with /sign.html, the Email or Google wallet's sign page)
server {
	listen 80;
	listen [::]:80;
	server_name marketplace.farmverse.world;
	root /var/www/farmverse/market;
	index index.html;
	location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
	location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}

# farmverse.world: the landing page
server {
	listen 80;
	listen [::]:80;
	server_name farmverse.world www.farmverse.world;
	root /var/www/farmverse/landing;
	index index.html;
	location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
	location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}

# admin.farmverse.world: the admin web (its API calls need an admin wallet)
server {
	listen 80;
	listen [::]:80;
	server_name admin.farmverse.world;
	root /var/www/farmverse/admin;
	index index.html;
	location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
	location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
