# Public entry for the Farmverse API (api. and server.farmverse.world → 127.0.0.1:8787).
# certbot --nginx adds the 443 listener, the certificate lines and the HTTP → HTTPS redirect
# to this block; provision.sh reinstalls them after copying this file over.

# WebSocket (/v1/live): pass the upgrade through, plain keep-alive otherwise.
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

upstream farmverse_api {
	server 127.0.0.1:8787;
	keepalive 32;
}

server {
	listen 80;
	listen [::]:80;
	server_name api.farmverse.world server.farmverse.world;

	# The server accepts bodies up to 4 MB.
	client_max_body_size 5m;

	location / {
		proxy_pass http://farmverse_api;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# Live sockets may sit quiet for a long time.
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}
}
