<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <!-- og:start (deployment/vercel.sh copies this block into builds made before it existed) -->
  <meta name="description" content="Farmverse is a free farm game in your browser, built on NEAR. Plant, harvest and fill orders, turn crops, buildings and land into NFTs, and trade them for $FARM. Sign in with email, no download. #NEARHackathon #Web3Gaming">
  <meta name="keywords" content="Farmverse, farm game, NEAR, NEAR Protocol, NEARHackathon, Web3Gaming, GameFi, NFT game, browser game, play to own">
  <meta name="theme-color" content="#0a4888">
  <link rel="canonical" href="https://play.farmverse.world/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Farmverse">
  <meta property="og:url" content="https://play.farmverse.world/">
  <meta property="og:title" content="Farmverse: grow it, own it, trade it on NEAR">
  <meta property="og:description" content="A free farm game in your browser. Grow your island, turn what you build into NFTs and trade them for $FARM on NEAR. #NEARHackathon #Web3Gaming #NEAR">
  <meta property="og:image" content="https://play.farmverse.world/og-image.jpg">
  <meta property="og:image:secure_url" content="https://play.farmverse.world/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Farmverse logo over a farm island: Grow it. Own it. Trade it. A free farm game on NEAR.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@farmverse_world">
  <meta name="twitter:title" content="Farmverse: grow it, own it, trade it on NEAR">
  <meta name="twitter:description" content="A free farm game in your browser, built on @NEARProtocol. Play free, no download. #NEARHackathon #Web3Gaming">
  <meta name="twitter:image" content="https://play.farmverse.world/og-image.jpg">
  <meta name="twitter:image:alt" content="The Farmverse logo over a farm island: Grow it. Own it. Trade it. A free farm game on NEAR.">
  <!-- og:end -->
  <link rel="stylesheet" href="farmverse-page.css">
  <link id="fv-icon" rel="icon" href="data:,">
  <script>
    // Set in Player Settings ▸ WebGL ▸ Resolution and Presentation (template variables). Empty = local dev.
    window.FARMVERSE_CONFIG = {
      apiBaseUrl: "{{{ FARMVERSE_API }}}" || "http://localhost:8787",
      network: "{{{ NEAR_NETWORK }}}" || "testnet",
      marketplaceUrl: "{{{ MARKETPLACE_URL }}}" || "https://marketplace.farmverse.world",
      siteUrl: "{{{ SITE_URL }}}" || "https://farmverse.world",
      // "on": an "Email or Google" wallet (Privy) next to the usual ones; its sign page is on the market site
      socialLogin: "{{{ SOCIAL_LOGIN }}}" === "on",
    };
  </script>
</head>
<body>
  <div id="fv-root">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <!-- the install screen: the first visit downloads the game (data-bytes: its size, set by deployment/vercel.sh) -->
    <div id="fv-loading" data-bytes="0">
      <div class="fv-install">
        <img class="fv-install-logo" alt="Farmverse" hidden>
        <div class="fv-install-card">
          <h1 id="fv-install-title">Installing Farmverse</h1>
          <ol class="fv-steps">
            <li id="fv-step-0" class="on"><span class="fv-step-dot">1</span>Download</li>
            <li id="fv-step-1"><span class="fv-step-dot">2</span>Unpack</li>
            <li id="fv-step-2"><span class="fv-step-dot">3</span>Start</li>
          </ol>
          <div class="fv-bar"><div id="fv-bar-fill"></div></div>
          <div class="fv-install-row"><span id="fv-install-detail">Getting ready</span><span id="fv-install-pct">0%</span></div>
          <p id="fv-install-note" class="fv-install-note">Only the first time. After this, your farm opens in seconds.</p>
          <p id="fv-install-tip" class="fv-install-tip"></p>
        </div>
      </div>
    </div>
    <!-- sign-in: Google and email first (no wallet app needed), a guest or a NEAR wallet as the other ways -->
    <div id="fv-signin" hidden>
      <div class="fv-card fv-signin-card">
        <img class="fv-signin-logo" alt="Farmverse" hidden>
        <p id="fv-signin-text">Sign in to save your farm and trade on the market.</p>
        <button id="fv-signin-button" type="button" class="fv-primary" hidden>Continue</button>
        <div id="fv-social" hidden>
          <button id="fv-google" type="button" class="fv-google"><svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Continue with Google</span></button>
          <form id="fv-email-form" class="fv-email">
            <input id="fv-email" type="email" required autocomplete="email" placeholder="Your email" aria-label="Your email">
            <button type="submit" class="fv-primary">Continue with email</button>
          </form>
        </div>
        <p id="fv-signin-error" class="fv-error" role="alert" hidden></p>
        <div id="fv-or" class="fv-or" role="separator" hidden><span>or</span></div>
        <div class="fv-alt">
          <button id="fv-guest-button" type="button" class="fv-secondary">Play as guest</button>
          <button id="fv-wallet-button" type="button" class="fv-secondary">NEAR wallet</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="farmverse-page.js"></script>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    // The install screen: the game's own art from the market site, the steps, and what's left to download.
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var root = $('fv-loading');
      var site = (window.FARMVERSE_CONFIG.marketplaceUrl || '').replace(/\/+$/, '');
      if (site) {
        root.style.backgroundImage = 'linear-gradient(rgba(6, 22, 40, 0.1), rgba(6, 22, 40, 0.7)), url(' + site + '/ui/Home_LoadingBg.webp)';
        document.querySelectorAll('.fv-install-logo, .fv-signin-logo').forEach(function (logo) {
          logo.onload = function () { logo.hidden = false; };
          logo.src = site + '/ui/Home_Logo.webp';
        });
        $('fv-icon').href = site + '/ui/Icon_Clover.webp';
        if (window.FontFace) {
          [['FvTitle', 'LilitaOne'], ['FvBody', 'NunitoExtraBold']].forEach(function (f) {
            new FontFace(f[0], 'url(' + site + '/fonts/' + f[1] + '.ttf)').load().then(function (face) { document.fonts.add(face); }, function () {});
          });
        }
      }

      var tips = [
        'Plant crops, wait, harvest, sell. Coins buy more land.',
        'Turn spare goods into NFTs and sell them on the market for FARM.',
        'Farmhands work your farm and get better at it.',
        'Minting and redeeming are free. We pay the network fee.',
        'Bea, Ruth, Tomas and Ivy set their prices from what they hold.',
      ];
      var tip = Math.floor(Math.random() * tips.length);
      var showTip = function () { $('fv-install-tip').textContent = tips[tip++ % tips.length]; };
      showTip();
      var tipTimer = setInterval(showTip, 6000);

      var bytes = Number(root.getAttribute('data-bytes')) || 0;
      var started = Date.now(), samples = [], cached = null, failed = false;
      var mb = function (b) { return (b / 1048576).toFixed(b < 10 * 1048576 ? 1 : 0); };
      var step = function (n) {
        for (var i = 0; i < 3; i++) $('fv-step-' + i).className = i < n ? 'done' : i === n ? 'on' : '';
      };

      // Unity reports 0..0.9 while downloading, then up to 1 while it unpacks and starts
      window.fvProgress = function (p) {
        if (failed) return;
        var pct = Math.round(Math.min(1, p) * 100);
        $('fv-bar-fill').style.width = pct + '%';
        $('fv-install-pct').textContent = pct + '%';
        var d = Math.min(1, p / 0.9);
        if (cached === null && d >= 1) {
          // done downloading in a moment: it came from this browser's cache
          cached = Date.now() - started < 2500;
          if (cached) { $('fv-install-title').textContent = 'Opening your farm'; $('fv-install-note').hidden = true; }
        }
        if (d < 1) {
          step(0);
          if (!bytes) { $('fv-install-detail').textContent = 'Downloading the game'; return; }
          var got = d * bytes, now = Date.now();
          samples.push([now, got]);
          while (samples.length > 2 && now - samples[0][0] > 4000) samples.shift();
          var rate = samples.length > 1 ? (got - samples[0][1]) / ((now - samples[0][0]) / 1000) : 0;
          var text = mb(got) + ' of ' + mb(bytes) + ' MB';
          if (rate > 50000) {
            var left = (bytes - got) / rate;
            text += ' · ' + mb(rate) + ' MB/s';
            if (left >= 1) text += ' · about ' + (left < 60 ? Math.ceil(left) + ' s' : Math.ceil(left / 60) + ' min') + ' left';
          }
          $('fv-install-detail').textContent = text;
        } else if (p < 1) {
          step(1);
          $('fv-install-detail').textContent = 'Unpacking the farm';
        } else {
          step(2);
          $('fv-install-detail').textContent = 'Starting your farm';
        }
      };
      window.fvStarted = function () { clearInterval(tipTimer); root.hidden = true; };
      window.fvFailed = function (message) {
        failed = true;
        clearInterval(tipTimer);
        root.classList.add('fv-failed');
        $('fv-install-title').textContent = 'The game could not start';
        $('fv-install-detail').textContent = String(message);
        $('fv-install-pct').textContent = '';
        $('fv-install-note').hidden = false;
        $('fv-install-note').textContent = 'Reload the page to try again.';
      };
    })();

    var canvas = document.getElementById('unity-canvas');
    createUnityInstance(canvas, {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    }, function (progress) {
      window.fvProgress(progress);
    }).then(function (instance) {
      window.unityInstance = instance;
      window.fvStarted();
    }).catch(function (message) {
      window.fvFailed(message);
    });
  </script>
</body>
</html>
