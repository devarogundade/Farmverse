<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="stylesheet" href="farmverse-page.css">
  <script>
    // Set in Player Settings ▸ WebGL ▸ Resolution and Presentation (template variables). Empty = local dev.
    window.FARMVERSE_CONFIG = {
      apiBaseUrl: "{{{ FARMVERSE_API }}}" || "http://localhost:8787",
      network: "{{{ NEAR_NETWORK }}}" || "testnet",
      marketplaceUrl: "{{{ MARKETPLACE_URL }}}" || "https://marketplace.farmverse.world",
      siteUrl: "{{{ SITE_URL }}}" || "https://farmverse.world",
      // "on": an "Email or Google" wallet (Privy) next to the usual ones; its sign page is on the market site
      socialLogin: "{{{ SOCIAL_LOGIN }}}" === "on",
    };
  </script>
</head>
<body>
  <div id="fv-root">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="fv-loading"><div class="fv-logo">Farmverse</div><div class="fv-bar"><div id="fv-bar-fill"></div></div></div>
    <div id="fv-signin" hidden>
      <div class="fv-card">
        <div class="fv-logo">Farmverse</div>
        <p id="fv-signin-text">Connect a NEAR wallet to play. Your farm is saved to your wallet account.</p>
        <button id="fv-signin-button" type="button">Connect wallet</button>
        <p id="fv-signin-error" class="fv-error" hidden></p>
        <p class="fv-small">New to NEAR? Any NEAR wallet works (HOT, Meteor, MyNearWallet, Intear…).</p>
      </div>
    </div>
  </div>
  <script type="module" src="farmverse-page.js"></script>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var canvas = document.getElementById('unity-canvas');
    createUnityInstance(canvas, {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    }, function (progress) {
      document.getElementById('fv-bar-fill').style.width = Math.round(progress * 100) + '%';
    }).then(function (instance) {
      window.unityInstance = instance;
      document.getElementById('fv-loading').hidden = true;
    }).catch(function (message) {
      document.getElementById('fv-loading').textContent = 'The game could not start: ' + message;
    });
  </script>
</body>
</html>
