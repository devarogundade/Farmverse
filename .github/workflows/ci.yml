name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Contracts — typecheck, test, generated C# is current
        run: |
          npm run typecheck --workspace contracts
          npm run test --workspace contracts
          npm run contracts:check
          npm run economy:check --workspace contracts
      - name: Backend — typecheck, test, bundle
        run: |
          npm run typecheck --workspace backend/functions
          npm run typecheck --workspace backend/rules-tests
          npm run test --workspace backend/functions
          npm run vectors:check --workspace backend/functions
          npm run build --workspace backend/functions

  emulator:
    # Security rules tests and the game against the real Firestore SDK (needs Java for the emulator).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Firestore rules
        run: npm run test:emulator --workspace backend/rules-tests
      - name: Game against the emulator
        run: npm run test:emulator --workspace backend/functions

  engine-free-csharp:
    # Contracts, Core, Domain, Application and Presentation (presenters, world model)
    # are engine-free, so their EditMode tests — including the conformance vectors —
    # run under plain .NET in seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet build tools/dotnet/Farmverse.TestHost -c Release
      - run: dotnet tools/dotnet/Farmverse.TestHost/bin/Release/net8.0/Farmverse.TestHost.dll
      - name: Codegen and string table are current
        run: |
          python3 tools/codegen/gen_commands.py --check
          python3 tools/codegen/check_strings.py
          python3 tools/codegen/check_remote_config.py
          python3 tools/codegen/check_secrets.py

  # unity:
  #   GameCI EditMode/PlayMode runs and the compile check of the engine assemblies
  #   (dotnet build tools/dotnet/UnityCheck/Farmverse.Bootstrap.csproj) need a Unity
  #   licence (UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD secrets). Enable when they exist:
  #   runs-on: ubuntu-latest
